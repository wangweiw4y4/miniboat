IMU: {
  ANGLE_DRIFT: 0,
  USE_BNO055: 1
}

trajectory: {
    sim_time: 500,
    init_x: 0,
    init_y: 0,
    angle_rotate: 0,
    file: /paths/miniboat_shapeshift_miniboat4.csv,
   repeat: false
}


PID: {
    P: 0.5,
    I: 0,
    D: 2,
    req_theta: 1,
    req_force: 0.25
}

port: {
    serial: "/dev/ttyS0",
}

joypad: {
    max_force: 0.66
}

sensor_covariance: {
    imu: {
        acceleration: {
            '11': 0.3,
            '22': 0.3,
            '33': 0.5
        },
        velocity: {
            '11': 0.01,
            '22': 0.01,
            '33': 0.01
        },
        orrientation: {
            '11': 0.1,
            '22': 0.1,
            '33': 4.0
        }
    },
    lidar: {
        orientation: {
            '11': 0.1,
            '22': 0.1,
            '33': 1.0
        },
        pose: {
            '11': 0.1,
            '22': 0.1,
            '33': 0.1
        }
    }
}

model_identification: {
    bounds: [1.0, 0.0, 3.0, 7.0],
    n_steps: 4,
    ref_len: 0.4,           #(m)
    ref_force: 1.0,         #(N)
    ref_vel: 0.1,           #(m/s)
    pos_threshold: 0.05,    #(m)
    dir_threshold: deg(5),  #(rad)
    vel_threshold: 0.02,    #(m/s)
    yaw_cmd: 0.05,          #(N)
    yaw_threshold: deg(15)  #(rad)
}
