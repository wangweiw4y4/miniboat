# Values
# [X, Y, Z]
# [roll, pitch, yaw]
# [v_x, v_y, v_z]
# [v_roll, v_pitch, v_yaw]
# [a_x, a_y, a_z]

publish_tf: true
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

frequency: 50
two_d_mode: true
sensor_timeout: 0.01
publish_acceleration: true
smooth_lagged_data: true
history_length: 4.0

# -------------------------------------
# IMU:
# -------------------------------------
# bno055:
imu0: data/imu0
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              true,  true,  true,
              false,  false,  false]
imu0_differential: false
imu0_queue_size: 100
#imu0_remove_gravitational_acceleration: true

# paired Hedge beacons:
# imu1: data/imu1
# imu1_config: [false, false, false,
#               false, false, false,
#               false, false, false,
#               true,  true,  true,
#               true,  true,  true]
# imu1_differential: false
# imu1_queue_size: 100
# #imu1_remove_gravitational_acceleration: true

# -------------------------------------
# Odometry 
# -------------------------------------
# paired Hedge beacons:
odom0: data/paired_beacons
odom0_config: [true,  true,  true,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_differential: false
odom0_queue_size: 100


