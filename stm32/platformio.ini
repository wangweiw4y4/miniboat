; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = cmsis ;stm32cube gives an error as it loads CMSIS libraries anyways upon compilation
board_build.mcu = stm32f103c8t6
board_build.f_cpu = 72000000L
;board_build.stm32cube.startup_file = startup_stm32f10x_hd.s
;lib_deps = enwaytech/ros_lib Arduino@^0.7.7
build_flags = -w -D STM32F10X_MD -D USE_STDPERIPH_DRIVER
;upload_port = /dev/ttyACM0
;upload_protocol = stlink
;upload_flags = -c set CPUTAPID 0x2ba01477